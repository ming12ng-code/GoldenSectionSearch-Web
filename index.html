<!DOCTYPE html>
<html>
<head>
    <title>Golden Section Search</title>
</head>

<body>

    <h1>Golden Section Search</h1>

    <p>Objective Function</p>
    <input type="text" id="function" value="ln(x)-4*x+5">

    <p>Start of interval</p>
    <input type="number" id="start" value="1">

    <p>End of interval</p>
    <input type="number" id="end" value="10">

    <p>Tolerance</p>
    <input type="number" id="tolerance" value="0.0001" step="any">

    <br><br>

    <button onclick="calculate()">Calculate</button>

    <script>

        async function calculate() {

            try {

                const response = await fetch("/api");

                const data = await response.json();

                alert(data.message);

            } catch (error) {

                alert("Error connecting to Python API");

            }

        }

    </script>

</body>
</html>
