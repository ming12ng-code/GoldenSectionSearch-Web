<!DOCTYPE html>
<html>

<head>

    <title>Golden Section Search</title>

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .result-box {
            background: #f4f4f4;
            padding: 15px;
            margin-top: 10px;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 13px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 7px;
            text-align: center;
        }

        th {
            background: #eeeeee;
        }

        #error {
            color: red;
            margin-top: 20px;
            font-weight: bold;
        }

        #plot {
            width: 100%;
            height: 600px;
            margin-top: 20px;
        }

    </style>

</head>


<body>


<h1>Golden Section Search</h1>


<label>Objective Function</label>

<input
    type="text"
    id="function"
    value="ln(x)-4*x+5"
>


<label>Start of interval</label>

<input
    type="number"
    id="start"
    value="1"
    step="any"
>


<label>End of interval</label>

<input
    type="number"
    id="end"
    value="10"
    step="any"
>


<label>Tolerance</label>

<input
    type="number"
    id="tolerance"
    value="0.0001"
    step="any"
>


<button onclick="calculate()">
    Calculate
</button>


<div id="error"></div>


<h2>Results</h2>


<div class="result-box">
    Minimum x =
    <span id="minimum-x"></span>
</div>


<div class="result-box">
    Minimum f(x) =
    <span id="minimum-f"></span>
</div>


<div class="result-box">
    Iterations =
    <span id="iterations"></span>
</div>


<div class="result-box">
    Theoretical K =
    <span id="theoretical-k"></span>
</div>


<div class="result-box">
    Final interval =
    <span id="final-interval"></span>
</div>


<h2>Iteration Table</h2>


<table>

<thead>

<tr>

<th>Iteration</th>
<th>x1</th>
<th>x2</th>
<th>f(x1)</th>
<th>f(x2)</th>
<th>a</th>
<th>b</th>
<th>Interval Length</th>

</tr>

</thead>


<tbody id="iteration-table"></tbody>


</table>


<h2>Graph</h2>

<div id="plot"></div>



<script>


async function calculate() {


    const functionString =
        document.getElementById("function").value;


    const start =
        parseFloat(
            document.getElementById("start").value
        );


    const end =
        parseFloat(
            document.getElementById("end").value
        );


    const tolerance =
        parseFloat(
            document.getElementById("tolerance").value
        );


    document.getElementById("error").textContent = "";


    try {


        /* ==========================
           CALL PYTHON API
        ========================== */


        const response = await fetch(

            "/api?" +

            new URLSearchParams({

                function: functionString,

                start: start,

                end: end,

                tolerance: tolerance

            })

        );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(data.error);

        }


        /* ==========================
           RESULTS
        ========================== */


        document.getElementById(
            "minimum-x"
        ).textContent =
            data.minimum_x;


        document.getElementById(
            "minimum-f"
        ).textContent =
            data.minimum_f;


        document.getElementById(
            "iterations"
        ).textContent =
            data.iterations;


        document.getElementById(
            "theoretical-k"
        ).textContent =
            data.theoretical_k;


        document.getElementById(
            "final-interval"
        ).textContent =

            "[" +
            data.final_interval[0] +
            ", " +
            data.final_interval[1] +
            "]";


        /* ==========================
           ITERATION TABLE
        ========================== */


        const table =
            document.getElementById(
                "iteration-table"
            );


        table.innerHTML = "";


        data.iteration_table.forEach(
            function(row) {


                const tr =
                    document.createElement("tr");


                tr.innerHTML =

                    "<td>" +
                    row.iteration +
                    "</td>" +

                    "<td>" +
                    row.x1 +
                    "</td>" +

                    "<td>" +
                    row.x2 +
                    "</td>" +

                    "<td>" +
                    row["f(x1)"] +
                    "</td>" +

                    "<td>" +
                    row["f(x2)"] +
                    "</td>" +

                    "<td>" +
                    row.a +
                    "</td>" +

                    "<td>" +
                    row.b +
                    "</td>" +

                    "<td>" +
                    row.interval_length +
                    "</td>";


                table.appendChild(tr);

            }
        );


        /* ==========================
           DRAW GRAPH
        ========================== */


        drawGraph(

            functionString,

            start,

            end,

            data.minimum_x,

            data.minimum_f

        );


    }

    catch (error) {


        document.getElementById(
            "error"
        ).textContent =
            "Error: " + error.message;


    }

}



/* =================================================
   GRAPH
================================================= */


function drawGraph(
    functionString,
    start,
    end,
    minimumX,
    minimumY
) {


    /*
       Convert user's mathematical expression
       into JavaScript.
    */


    let expression =
        functionString;


    expression =
        expression.replace(
            /\bln\s*\(/gi,
            "Math.log("
        );


    expression =
        expression.replace(
            /\blog\s*\(/gi,
            "Math.log("
        );


    expression =
        expression.replace(
            /\bsin\s*\(/gi,
            "Math.sin("
        );


    expression =
        expression.replace(
            /\bcos\s*\(/gi,
            "Math.cos("
        );


    expression =
        expression.replace(
            /\btan\s*\(/gi,
            "Math.tan("
        );


    expression =
        expression.replace(
            /\bexp\s*\(/gi,
            "Math.exp("
        );


    expression =
        expression.replace(
            /\^/g,
            "**"
        );


    /*
       Create JavaScript function.
    */


    let f;


    try {

        f = new Function(
            "x",
            "return " + expression
        );

    }

    catch (error) {

        document.getElementById(
            "error"
        ).textContent =
            "Graph error: Invalid function.";

        return;

    }


    /*
       Generate points.
    */


    const xValues = [];

    const yValues = [];


    const points = 500;


    /*
       For ln(x), we must NEVER
       calculate x <= 0.
    */


    let graphStart = start;

    let graphEnd = end;


    if (
        expression.includes("Math.log")
    ) {

        graphStart =
            Math.max(
                graphStart,
                0.000001
            );

    }


    const range =
        graphEnd - graphStart;


    /*
       Add a little space
       around the interval.
    */


    graphStart =
        graphStart -
        range * 0.05;


    graphEnd =
        graphEnd +
        range * 0.05;


    /*
       Make sure ln(x)
       never receives x <= 0.
    */


    if (
        expression.includes("Math.log")
        &&
        graphStart <= 0
    ) {

        graphStart = 0.000001;

    }


    /*
       Generate x and y.
    */


    for (
        let i = 0;
        i < points;
        i++
    ) {


        const x =

            graphStart +

            (
                graphEnd -
                graphStart
            )
            *
            i
            /
            (points - 1);


        try {


            const y = f(x);


            if (
                Number.isFinite(y)
            ) {

                xValues.push(x);

                yValues.push(y);

            }


        }

        catch {

            // Ignore invalid points

        }

    }


    /*
       Check graph data.
    */


    if (
        xValues.length === 0
    ) {

        document.getElementById(
            "error"
        ).textContent =
            "Graph error: Function cannot be plotted in this interval.";

        return;

    }


    /*
       Function curve.
    */


    const functionTrace = {

        x: xValues,

        y: yValues,

        mode: "lines",

        name: "f(x)"

    };


    /*
       Minimum point.
    */


    const minimumTrace = {

        x: [minimumX],

        y: [minimumY],

        mode: "markers",

        name: "Approx. Minimum",

        marker: {

            size: 12

        }

    };


    /*
       Graph layout.
    */


    const layout = {

        title:
            "f(x) = " +
            functionString,

        xaxis: {

            title: "x"

        },

        yaxis: {

            title: "f(x)"

        },

        showlegend: true,

        hovermode: "closest"

    };


    /*
       Plot.
    */


    Plotly.newPlot(

        "plot",

        [
            functionTrace,
            minimumTrace
        ],

        layout,

        {
            responsive: true
        }

    );

}


</script>


</body>

</html>
