<!DOCTYPE html>
<html>

<head>

    <title>Golden Section Search</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #results {
            margin-top: 35px;
        }

        .result-box {
            background: #f4f4f4;
            padding: 15px;
            margin-top: 10px;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #eeeeee;
        }

        #error {
            color: red;
            margin-top: 20px;
            font-weight: bold;
        }

        #graph {
            margin-top: 40px;
        }

        #graphCanvas {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
            display: block;
        }

    </style>

</head>


<body>


    <h1>Golden Section Search</h1>


    <label>Objective Function</label>

    <input
        type="text"
        id="function"
        value="ln(x)-4*x+5"
    >


    <label>Start of interval</label>

    <input
        type="number"
        id="start"
        value="1"
        step="any"
    >


    <label>End of interval</label>

    <input
        type="number"
        id="end"
        value="10"
        step="any"
    >


    <label>Tolerance</label>

    <input
        type="number"
        id="tolerance"
        value="0.0001"
        step="any"
    >


    <button onclick="calculate()">

        Calculate

    </button>


    <div id="error"></div>


    <div id="results">

        <h2>Results</h2>


        <div class="result-box">
            Minimum x =
            <span id="minimum-x"></span>
        </div>


        <div class="result-box">
            Minimum f(x) =
            <span id="minimum-f"></span>
        </div>


        <div class="result-box">
            Iterations =
            <span id="iterations"></span>
        </div>


        <div class="result-box">
            Theoretical K =
            <span id="theoretical-k"></span>
        </div>


        <div class="result-box">
            Final interval =
            <span id="final-interval"></span>
        </div>


        <h2>Iteration Table</h2>


        <table>

            <thead>

                <tr>

                    <th>Iteration</th>
                    <th>x1</th>
                    <th>x2</th>
                    <th>f(x1)</th>
                    <th>f(x2)</th>
                    <th>a</th>
                    <th>b</th>
                    <th>Interval Length</th>

                </tr>

            </thead>


            <tbody id="iteration-table">

            </tbody>

        </table>


        <div id="graph">

            <h2>Graph</h2>

            <canvas id="graphCanvas"></canvas>

        </div>


    </div>


<script>


async function calculate() {


    const functionString =
        document.getElementById("function").value;


    const start =
        parseFloat(
            document.getElementById("start").value
        );


    const end =
        parseFloat(
            document.getElementById("end").value
        );


    const tolerance =
        parseFloat(
            document.getElementById("tolerance").value
        );


    document.getElementById("error").textContent = "";


    try {


        const response = await fetch(
            "/api?" +
            new URLSearchParams({
                function: functionString,
                start: start,
                end: end,
                tolerance: tolerance
            })
        );


        const data = await response.json();


        if (!response.ok) {

            throw new Error(data.error);

        }


        document.getElementById("minimum-x").textContent =
            data.minimum_x;


        document.getElementById("minimum-f").textContent =
            data.minimum_f;


        document.getElementById("iterations").textContent =
            data.iterations;


        document.getElementById("theoretical-k").textContent =
            data.theoretical_k;


        document.getElementById("final-interval").textContent =
            "[" +
            data.final_interval[0] +
            ", " +
            data.final_interval[1] +
            "]";


        const table =
            document.getElementById("iteration-table");


        table.innerHTML = "";


        data.iteration_table.forEach(function(row) {


            const tr =
                document.createElement("tr");


            tr.innerHTML =

                "<td>" + row.iteration + "</td>" +
                "<td>" + row.x1 + "</td>" +
                "<td>" + row.x2 + "</td>" +
                "<td>" + row["f(x1)"] + "</td>" +
                "<td>" + row["f(x2)"] + "</td>" +
                "<td>" + row.a + "</td>" +
                "<td>" + row.b + "</td>" +
                "<td>" + row.interval_length + "</td>";


            table.appendChild(tr);


        });


        drawGraph(
            functionString,
            start,
            end,
            data.minimum_x,
            data.minimum_f
        );


    }


    catch (error) {


        document.getElementById("error").textContent =
            "Error: " + error.message;


    }

}


/* ==========================================
   GRAPH
   ========================================== */


function drawGraph(
    functionString,
    start,
    end,
    minimumX,
    minimumY
) {


    const canvas =
        document.getElementById("graphCanvas");


    const ctx =
        canvas.getContext("2d");


    /*
       Important:
       Canvas needs a real width and height.
    */

    const width = 1000;

    const height = 500;


    canvas.width = width;

    canvas.height = height;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
       Convert Python-style function
       into JavaScript function
    */

    let expression =
        functionString;


    expression =
        expression.replace(
            /ln\(/g,
            "Math.log("
        );


    expression =
        expression.replace(
            /log\(/g,
            "Math.log("
        );


    expression =
        expression.replace(
            /sin\(/g,
            "Math.sin("
        );


    expression =
        expression.replace(
            /cos\(/g,
            "Math.cos("
        );


    expression =
        expression.replace(
            /tan\(/g,
            "Math.tan("
        );


    expression =
        expression.replace(
            /exp\(/g,
            "Math.exp("
        );


    expression =
        expression.replace(
            /\^/g,
            "**"
        );


    /*
       Create JavaScript function
    */

    let functionForGraph;


    try {


        functionForGraph =
            new Function(
                "x",
                "return " + expression
            );


    }

    catch (error) {


        document.getElementById("error").textContent =
            "Graph error: Invalid function.";


        return;

    }


    /*
       Create graph points
    */

    const points = [];


    const numberOfPoints = 500;


    const interval =
        end - start;


    const graphStart =
        start - interval * 0.1;


    const graphEnd =
        end + interval * 0.1;


    let minY = Infinity;

    let maxY = -Infinity;


    for (
        let i = 0;
        i < numberOfPoints;
        i++
    ) {


        const x =
            graphStart +
            (
                graphEnd - graphStart
            ) *
            i /
            (
                numberOfPoints - 1
            );


        let y;


        try {

            y =
                functionForGraph(x);

        }

        catch {

            y = NaN;

        }


        if (
            Number.isFinite(y)
        ) {


            points.push({
                x: x,
                y: y
            });


            minY =
                Math.min(
                    minY,
                    y
                );


            maxY =
                Math.max(
                    maxY,
                    y
                );

        }

    }


    /*
       If no points were generated
    */

    if (points.length === 0) {


        document.getElementById("error").textContent =
            "Graph error: Function cannot be plotted in this interval.";


        return;

    }


    /*
       Prevent division by zero
    */

    if (minY === maxY) {

        minY -= 1;

        maxY += 1;

    }


    const padding = 60;


    /*
       Convert mathematical coordinates
       to canvas coordinates
    */

    function mapX(x) {


        return (

            padding +

            (
                x - graphStart
            ) /
            (
                graphEnd - graphStart
            ) *

            (
                width - 2 * padding
            )

        );

    }


    function mapY(y) {


        return (

            height -
            padding -

            (
                y - minY
            ) /
            (
                maxY - minY
            ) *

            (
                height - 2 * padding
            )

        );

    }


    /*
       Draw background
    */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
       Draw X axis
    */

    ctx.beginPath();

    ctx.moveTo(
        padding,
        height - padding
    );

    ctx.lineTo(
        width - padding,
        height - padding
    );

    ctx.stroke();


    /*
       Draw Y axis
    */

    ctx.beginPath();

    ctx.moveTo(
        padding,
        padding
    );

    ctx.lineTo(
        padding,
        height - padding
    );

    ctx.stroke();


    /*
       Draw function curve
    */

    ctx.beginPath();


    let firstPoint = true;


    points.forEach(function(point) {


        const px =
            mapX(point.x);


        const py =
            mapY(point.y);


        if (firstPoint) {


            ctx.moveTo(
                px,
                py
            );


            firstPoint = false;

        }

        else {


            ctx.lineTo(
                px,
                py
            );

        }

    });


    ctx.stroke();


    /*
       Draw minimum point
    */

    const minimumPX =
        mapX(minimumX);


    const minimumPY =
        mapY(minimumY);


    ctx.beginPath();


    ctx.arc(
        minimumPX,
        minimumPY,
        8,
        0,
        2 * Math.PI
    );


    ctx.fill();


    /*
       Draw minimum label
    */

    ctx.font =
        "18px Arial";


    ctx.fillText(
        "Minimum",
        minimumPX + 12,
        minimumPY - 20
    );


    ctx.fillText(
        "x = " +
        Number(minimumX).toFixed(4),
        minimumPX + 12,
        minimumPY + 5
    );


    ctx.fillText(
        "f(x) = " +
        Number(minimumY).toFixed(4),
        minimumPX + 12,
        minimumPY + 30
    );


    /*
       Draw graph title
    */

    ctx.font =
        "20px Arial";


    ctx.fillText(
        "f(x) = " + functionString,
        padding,
        30
    );


}


</script>


</body>

</html>
